# DEVELOPMENT stack. For a real server use docker-compose.prod.yml (see docs/deployment.md).
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: piano, POSTGRES_PASSWORD: piano, POSTGRES_DB: piano }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piano"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment: { MINIO_ROOT_USER: piano, MINIO_ROOT_PASSWORD: pianopiano }
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]
  api:
    build: ./backend
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes: ["./backend:/srv", "storage:/data/storage"]
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    volumes: ["./backend:/srv", "storage:/data/storage"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  beat:
    # Runs the daily jobs (plan-ending emails 07:00 UTC, clearing dead sessions/links 03:30 UTC). Run exactly one of these.
    build: ./backend
    env_file: .env
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    volumes: ["./backend:/srv"]
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started } }
  web:
    build: { context: ./frontend, dockerfile: Dockerfile.dev }
    env_file: .env
    command: npm run dev
    volumes: ["./frontend:/app", "/app/node_modules"]
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {}, miniodata: {}, storage: {} }
